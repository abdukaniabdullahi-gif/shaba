<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="stylesheet" href="school-templete.css">
    <script src="/jquery-4.0.0.min.js"></script>
</head>

<body>
    <header class="top-header">
        <div class="header-left">
            <button id="menu-toggle" class="menu-btn">☰</button>
            <div class="logo">S</div>
            <h1 class="school-name">School Management</h1>
        </div>
        <div class="header-right">
            <a href="login.html" class="logout-btn">Logout</a>
        </div>
    </header>

    <div class="container">
        <nav class="sidebar">
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>

                <div>
                    <li><a class="dropdown-label" href="forms.html" id="hello">FORMS</a></li>
                </div>
                <div>
                    <ul class="submenu" id="hello1">
                        <li><a href="student-form.html">Student Form</a></li>
                        <li><a href="teacher-form.html">Teacher Form</a></li>
                        <li><a href="manager-form.html">Manager Form</a></li>
                        <li><a href="finance-form.html">Finance Form</a></li>
                        <li><a href="attendence-form.html">Attendance Form</a></li>
                    </ul>
                </div>

                <li> <a href="reports.html" class="dropdown-label" id="hi">REPORTS</a></li>
                <ul class="submenu" id="hi1">
                    <li><a href="student-report.html">Student Report</a></li>
                    <li><a href="finance-report.html">Finance Report</a></li>
                    <li><a href="attendence-report.html">Attendance Report</a></li>
                </ul>
            </ul>
        </nav>
    </div>
    <script>
        $(document).ready(function () {
            // 1. Menu-ka Mobile-ka (Toggle Sidebar)
            $("#menu-toggle").on("click", function (e) {
                e.preventDefault();
                $(".sidebar").toggleClass("active");

                // Bedel icon-ka ☰ iyo ✕
                if ($(".sidebar").hasClass("active")) {
                    $(this).text("✕");
                } else {
                    $(this).text("☰");
                }
            });

            // 2. Dropdown-ka FORMS (Halkan waa meesha ciladu kaa jirtay)
            $("#hello").on("click", function (e) {
                e.preventDefault();
                e.stopPropagation(); // Tan ayaa muhiim ah si aanu click-ku u dhuuman
                $("#hello1").stop().slideToggle(300); // SlideToggle ayaa ka fiican slideDown
                $(this).find(".arrow").toggleClass("rotate-arrow"); // Haddii aad arrow isticmaashid
            });

            // 3. Dropdown-ka REPORTS
            $("#hi").on("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                $("#hi1").stop().slideToggle(300);
                $(this).find(".arrow").toggleClass("rotate-arrow");
            });

            // 4. Inuu menu-ku xirmo haddii meel bannaanka ah la taabto
            $(document).on("click", function (e) {
                if (!$(e.target).closest('.sidebar, #menu-toggle').length) {
                    $(".sidebar").removeClass("active");
                    $("#menu-toggle").text("☰");
                }
            });
        });
    </script>
</body>

</html>
